  font-family:'Montserrat',-apple-system,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:26px 16px 34px;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(58% 38% at 50% 108%, rgba(213,255,64,0.10), transparent 62%),
    radial-gradient(60% 34% at 50% -8%, rgba(255,255,255,0.022), transparent 60%);
}

.masthead{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  text-align:center;margin-bottom:22px;max-width:62ch;
}
.eyebrow{
  font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--accent);
  display:inline-flex;align-items:center;gap:9px;
}
.eyebrow::before,.eyebrow::after{content:'';width:18px;height:1px;background:var(--hairline)}
/* Poppins ships no Cyrillic, so it is scoped to the Latin wordmark only. */
.wordmark{font-family:'Poppins','Montserrat',sans-serif;font-weight:700}
.masthead h1{font-size:22px;font-weight:700;letter-spacing:-0.3px;text-wrap:balance;line-height:1.25}
.masthead p{font-size:12.5px;line-height:1.6;color:var(--muted);text-wrap:balance;max-width:46ch;font-weight:400}

.stage{position:relative;z-index:1;display:flex;justify-content:center;width:100%}
.scaler{transform-origin:top center}
#root{width:402px;height:874px}

.footnote{
  position:relative;z-index:1;margin-top:22px;
  font-size:11.5px;line-height:1.55;color:var(--muted);text-align:center;max-width:48ch;font-weight:400;
}
.footnote b{color:var(--ink);font-weight:600}

input::placeholder,textarea::placeholder{color:rgba(192,194,184,0.38)!important}
::-webkit-scrollbar{width:0;height:0}
@keyframes breathe{0%,100%{transform:scale(0.72)}45%,55%{transform:scale(1)}}
@keyframes haloPulse{0%,100%{opacity:0.35;transform:scale(1)}50%{opacity:0.7;transform:scale(1.08)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* The breathing orb paces the practice, so it keeps moving; only decorative
   entrances are stilled for reduced-motion. */
@media (prefers-reduced-motion:reduce){
  [style*="fadeUp"],[style*="haloPulse"]{animation:none!important}
}
</style>

<header class="masthead">
  <span class="eyebrow">Прототип</span>
  <h1><span class="wordmark">Anchor</span> — тренировка фокуса</h1>
  <p>Два протокола: направленное внимание по утрам и якорь входа в рабочий режим. Всё кликается, таймеры идут, прогресс сохраняется в браузере.</p>
</header>

<div class="stage">
  <div class="scaler" id="scaler"><div id="root"></div></div>
</div>

<p class="footnote">Начните с карточки <b>«Направленное внимание»</b> — 5 минут, кнопка «Вернуть фокус» считает каждое возвращение как подход.</p>
