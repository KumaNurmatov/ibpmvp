<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LOFT — A1 poster</title>
<link rel="stylesheet" href="fonts.css">
<style>
  /* ---------- A1: 594 x 841 mm. Bleed is added via --bleed (0 or 3mm). ---------- */
  :root{
    --bleed: 0mm;
    --ink:   #F0EBE3;   /* тёплый светлый — текст и логотип */
    --paper: #1B1A18;   /* подложка под бетонную текстуру  */
    --muted: #9A9086;
    --line:  #4A443D;
  }

  @page { size: calc(594mm + var(--bleed)*2) calc(841mm + var(--bleed)*2); margin: 0; }

  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ background:#fff; }

  .page{
    position: relative;
    width:  calc(594mm + var(--bleed)*2);
    height: calc(841mm + var(--bleed)*2);
    padding: calc(36mm + var(--bleed)) calc(38mm + var(--bleed)) calc(34mm + var(--bleed));
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* бетонная стена как фон + лёгкое затемнение, чтобы текст не спорил с фактурой */
  .page::before{
    content:'';
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(14,13,12,.45) 0%, rgba(14,13,12,.20) 42%, rgba(14,13,12,.62) 100%),
      url('assets/concrete.jpg') center / cover no-repeat;
    z-index:0;
  }
  .page > *{ position:relative; z-index:1; }

  /* ---------- шапка ---------- */
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom: 20mm;
  }
  header img{ height: 26mm; width:auto; display:block; }
  .kicker{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:5.2mm;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:right;
    padding-top:3mm;
    white-space:pre-line;
    line-height:1.7;
  }

  /* ---------- фотоблок: одно фото на постер ---------- */
  .photo{ width:100%; height:540mm; overflow:hidden; background:#2A2724;
          outline:0.4mm solid rgba(240,235,227,.14); outline-offset:-0.2mm; }
  .photo img{ width:100%; height:100%; object-fit:cover; object-position:center; display:block; }

  /* ---------- цитата ---------- */
  .quote{
    flex:1;
    display:flex; flex-direction:column; justify-content:center;
    padding-top:18mm;
  }
  .quote .rule{ width:48mm; height:0.7mm; background:var(--ink); opacity:.8; margin-bottom:12mm; }
  blockquote{ text-wrap:balance; }

  /* --- на каждом постере свой шрифт цитаты --- */

  /* 1. Cormorant Garamond — классическая антиква, курсив */
  blockquote.f-cormorant{
    font-family:'Cormorant Garamond', 'Liberation Serif', serif;
    font-weight:400;
    font-style:italic;
    font-size:24mm;
    line-height:1.22;
    letter-spacing:-0.005em;
  }

  /* 2. Playfair Display — контрастная дидона, прямое начертание */
  blockquote.f-playfair{
    font-family:'Playfair Display', 'Liberation Serif', serif;
    font-weight:500;
    font-size:20mm;
    line-height:1.3;
    letter-spacing:-0.012em;
  }

  /* 3. Road Radio — геометрический гротеск, только капитель */
  blockquote.f-roadradio{
    font-family:'Road Radio', 'Inter', sans-serif;
    font-weight:400;
    font-size:18mm;
    line-height:1.36;
    letter-spacing:0.012em;
  }
  /* подпись под фактом: слева контекст, справа копирайт */
  .meta{
    margin-top:16mm;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16mm;
    font-family:'Inter', sans-serif;
    font-size:7mm;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .meta .author{ font-weight:600; }
  .meta .copy{ font-weight:400; letter-spacing:.24em; white-space:nowrap; }

  footer{
    margin-top:14mm;
    border-top:0.4mm solid var(--line);
    padding-top:6mm;
    display:flex; justify-content:space-between;
    font-family:'Inter', sans-serif;
    font-weight:400;
    font-size:4.6mm;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <img id="logo" src="assets/logo-light.png" alt="LOFT">
      <div class="kicker" id="kicker"></div>
    </header>

    <figure class="photo"><img id="hero" src=""></figure>

    <div class="quote">
      <div class="rule"></div>
      <blockquote id="quote"></blockquote>
      <div class="meta">
        <span class="author" id="author"></span>
        <span class="copy">© Borsan Construction</span>
      </div>
    </div>

    <footer>
      <span id="f-left"></span>
      <span id="f-right"></span>
    </footer>
  </div>

<script>
  const p = new URLSearchParams(location.search);
  const set = (id, v) => { const el = document.getElementById(id); if (v !== null) el.textContent = v; };
  document.documentElement.style.setProperty('--bleed', (p.get('bleed') || '0') + 'mm');
  document.getElementById('hero').src = p.get('hero');
  if (p.get('focus')) document.getElementById('hero').style.objectPosition = p.get('focus');
  document.getElementById('quote').className = 'f-' + (p.get('font') || 'cormorant');
  set('quote',  p.get('quote'));
  set('author', p.get('author'));
  set('kicker', p.get('kicker'));
  set('f-left', p.get('fleft'));
  set('f-right', p.get('fright'));
  if (!p.get('fleft') && !p.get('fright')) document.querySelector('footer').style.display = 'none';
</script>
</body>
</html>
