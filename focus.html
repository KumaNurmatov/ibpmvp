// ═══════════════════════════════════════════════════════════
// Storage helpers
// ═══════════════════════════════════════════════════════════
const KEY='anchor.state.v1';
const todayISO=(d=new Date())=>{ const x=new Date(d); x.setHours(0,0,0,0); return x.toISOString().slice(0,10); };
function loadState(){
  try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s) return s; }catch(e){}
  return {
    startDate: todayISO(),
    sessions: [],          // {date, type:'fa'|'anchor', minutes, returns?}
    anchor: {
      minutes: 3,
      steps: ['playlist','tea','light'],   // enabled ritual elements
      task: '',
    },
  };
}
function saveState(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }

// day index since first launch (0-based) → drives the progression 5→10→20
function dayNumber(startDate){
  const a=new Date(startDate), b=new Date(todayISO());
  return Math.max(0, Math.round((b-a)/86400000));
}
function suggestedMinutes(startDate){
  const w=Math.floor(dayNumber(startDate)/7); // week 0,1,2...
  if(w<=0) return 5;
  if(w===1) return 10;
  return 20;
}
function weekLabel(startDate){
  const w=Math.floor(dayNumber(startDate)/7)+1;
  return `Неделя ${w}`;
}
// current consecutive-day streak counting any session
function computeStreak(sessions){
  const days=new Set(sessions.map(s=>s.date));
  let streak=0; let cur=new Date(todayISO());
  // allow today OR yesterday to start the streak
  if(!days.has(todayISO())){
    const y=new Date(cur); y.setDate(y.getDate()-1);
    if(!days.has(todayISO(y))) return 0;
    cur=y;
  }
  while(days.has(todayISO(cur))){ streak++; cur.setDate(cur.getDate()-1); }
  return streak;
}

// ═══════════════════════════════════════════════════════════
// Small UI atoms
// ═══════════════════════════════════════════════════════════
function Tag({children, tone='accent', style={}}){
  const tones={
    accent:{bg:ACCENT.dim,color:ACCENT.hex,bd:ACCENT.dim2},
    neutral:{bg:'rgba(255,255,255,0.05)',color:DS.sub,bd:'rgba(255,255,255,0.08)'},
    green:{bg:'rgba(52,211,153,0.10)',color:DS.green,bd:'rgba(52,211,153,0.22)'},
  };
  const t=tones[tone]||tones.accent;
  return <span style={{fontSize:10.5,fontWeight:700,color:t.color,background:t.bg,
    border:`1px solid ${t.bd}`,borderRadius:6,padding:'3px 8px',letterSpacing:'0.05em',
    textTransform:'uppercase',whiteSpace:'nowrap',...style}}>{children}</span>;
}
function Primary({children,onPress,style={},disabled}){
  return <div onClick={disabled?undefined:onPress} style={{
    height:54,borderRadius:16,background:disabled?DS.s2:ACCENT.hex,color:disabled?DS.muted:ACCENT.on,
    display:'flex',alignItems:'center',justifyContent:'center',gap:8,
    fontSize:15,fontWeight:700,letterSpacing:-0.2,cursor:disabled?'default':'pointer',
    boxShadow:disabled?'none':`0 6px 24px ${ACCENT.dim2}`,...style}}>{children}</div>;
}
function Secondary({children,onPress,style={}}){
  return <div onClick={onPress} style={{
    height:52,borderRadius:16,background:DS.s1,border:`1px solid ${DS.border2}`,color:DS.text,
    display:'flex',alignItems:'center',justifyContent:'center',gap:8,

}
function Ghost({children,onPress,style={}}){
  return <div onClick={onPress} style={{display:'inline-flex',alignItems:'center',gap:6,
    color:DS.sub,fontSize:14,fontWeight:600,cursor:'pointer',...style}}>{children}</div>;
}
function Card({children,style={},onPress}){
  return <div onClick={onPress} style={{background:DS.s1,border:`1px solid ${DS.border}`,
    borderRadius:20,padding:18,cursor:onPress?'pointer':'default',...style}}>{children}</div>;
}
function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return `${m}:${String(s).padStart(2,'0')}`; }

// ═══════════════════════════════════════════════════════════
// Circular progress ring
// ═══════════════════════════════════════════════════════════
function Ring({size=260,stroke=6,progress=0,children}){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return (
    <div style={{position:'relative',width:size,height:size}}>
      <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={r} stroke="rgba(255,255,255,0.06)" strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={ACCENT.hex} strokeWidth={stroke} fill="none"
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-progress)}
          style={{transition:'stroke-dashoffset 0.9s linear'}}/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',
        alignItems:'center',justifyContent:'center'}}>{children}</div>
    </div>
  );
}

function plural(n,one,few,many){
  const m10=n%10,m100=n%100;
  if(m10===1&&m100!==11) return one;
  if(m10>=2&&m10<=4&&(m100<10||m100>=20)) return few;
  return many;
}

// ═══════════════════════════════════════════════════════════
// FA — session (live timer)
// ═══════════════════════════════════════════════════════════
function FASession({duration,nav,onFinish}){
  const total=duration*60;
  const [left,setLeft]=React.useState(total);
  const [returns,setReturns]=React.useState(0);
  const [running,setRunning]=React.useState(true);
  const [phase,setPhase]=React.useState('Вдох');
  const finishedRef=React.useRef(false);

  React.useEffect(()=>{
    if(!running) return;
    const id=setInterval(()=>{
      setLeft(l=>{
        if(l<=1){ clearInterval(id); return 0; }
        return l-1;
      });
    },1000);
    return ()=>clearInterval(id);
  },[running]);

  // breath phase label (8s cycle: 4s in / 4s out)
  React.useEffect(()=>{
    if(!running) return;
    const id=setInterval(()=>setPhase(p=>p==='Вдох'?'Выдох':'Вдох'),4000);
    return ()=>clearInterval(id);
  },[running]);

  React.useEffect(()=>{
    if(left===0 && !finishedRef.current){
      finishedRef.current=true;
      onFinish({minutes:duration,returns});
      nav('fa-done',{minutes:duration,returns});
    }
  },[left]);

  const progress=(total-left)/total;

  return (
    <div style={{minHeight:'100%',display:'flex',flexDirection:'column',
      background:`radial-gradient(80% 50% at 50% 20%, ${ACCENT.dim} 0%, ${DS.bg} 60%)`,padding:'12px 20px 40px'}}>

// ═══════════════════════════════════════════════════════════
// ANCHOR — run
// ═══════════════════════════════════════════════════════════
function AnchorRun({state,nav,onFinish}){
  const a=state.anchor;
  const items=RITUALS.filter(r=>a.steps.includes(r.id));
  const total=a.minutes*60;
  const [left,setLeft]=React.useState(total);
  const [done,setDone]=React.useState([]); // ids checked
  const [phase,setPhase]=React.useState('ritual'); // ritual | task
  const savedRef=React.useRef(false);

  React.useEffect(()=>{
    if(phase!=='ritual') return;
    const id=setInterval(()=>setLeft(l=>l<=1?0:l-1),1000);
    return ()=>clearInterval(id);
  },[phase]);

  const goTask=()=>{
    if(!savedRef.current){ savedRef.current=true; onFinish({minutes:a.minutes}); }
    setPhase('task');
  };

  if(phase==='task'){
    return (
      <div style={{padding:'8px 20px 40px',minHeight:'100%',display:'flex',flexDirection:'column',
        alignItems:'center',justifyContent:'center',textAlign:'center',
        background:`radial-gradient(80% 50% at 50% 25%, ${ACCENT.dim} 0%, ${DS.bg} 55%)`}}>
        <div style={{width:96,height:96,borderRadius:28,display:'flex',alignItems:'center',justifyContent:'center',
          background:`linear-gradient(135deg, ${ACCENT.hex}, ${ACCENT.deep})`,boxShadow:`0 0 50px ${ACCENT.dim2}`,
          marginBottom:22,animation:'fadeUp .5s ease'}}>
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none"><path d="M13 2L4.5 13H11l-1 9 8.5-11H12l1-9z" fill={ACCENT.on}/></svg>
        </div>
        <Tag>Режим работы включён</Tag>
        <div style={{fontSize:24,fontWeight:800,letterSpacing:-0.5,marginTop:14}}>Приступайте к задаче</div>
        <div style={{fontSize:16,color:ACCENT.hex,fontWeight:650,marginTop:10,padding:'0 10px'}}>
          {a.task?`«${a.task}»`:'Ваша целевая задача'}
        </div>
        <div style={{fontSize:13,color:DS.sub,marginTop:14,maxWidth:280,lineHeight:1.5}}>
          Телефон убран, окружение настроено. Начинайте прямо сейчас — не давайте сопротивлению шанса.
        </div>
        <div style={{width:'100%',marginTop:30,display:'flex',flexDirection:'column',gap:10}}>
          <Primary onPress={()=>nav('home')}>Готово, я в работе</Primary>
        </div>
      </div>
    );
  }

  const allChecked=items.every(i=>done.includes(i.id));
  const progress=(total-left)/total;

  return (
    <div style={{padding:'12px 20px 40px',minHeight:'100%',display:'flex',flexDirection:'column',
      background:`radial-gradient(80% 50% at 50% 12%, ${ACCENT.dim} 0%, ${DS.bg} 55%)`}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <Ghost onPress={()=>nav('anchor-intro')}>✕ Отмена</Ghost>
        <Tag>Ритуал</Tag>
      </div>

      <div style={{display:'flex',justifyContent:'center',margin:'18px 0 8px'}}>
        <Ring size={150} stroke={5} progress={progress}>
          <div style={{fontSize:30,fontWeight:800,fontVariantNumeric:'tabular-nums'}}>{fmt(left)}</div>
        </Ring>
      </div>
      <div style={{textAlign:'center',fontSize:13,color:DS.sub,marginBottom:20}}>
        Выполните ритуал спокойно и по порядку
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:10,flex:1}}>
        {items.map((r,i)=>{
          const on=done.includes(r.id);
          return (
            <div key={r.id} onClick={()=>setDone(d=>on?d.filter(x=>x!==r.id):[...d,r.id])}
              style={{display:'flex',alignItems:'center',gap:14,padding:'14px 16px',borderRadius:16,cursor:'pointer',
                background:on?ACCENT.dim:DS.s1,border:`1px solid ${on?ACCENT.dim2:DS.border}`,
                opacity:on?1:0.96,transition:'all .15s'}}>
              <div style={{fontSize:22,width:30,textAlign:'center',
                filter:on?'none':'grayscale(0.3)'}}>{r.icon}</div>
              <div style={{flex:1,fontSize:15,fontWeight:650,
                textDecoration:on?'line-through':'none',color:on?DS.sub:DS.text}}>{r.t}</div>
              <Check on={on}/>
            </div>
          );
        })}
      </div>

      <Primary style={{marginTop:16}} onPress={goTask}>Приступить к задаче →</Primary>
      <div style={{fontSize:11.5,color:DS.muted,textAlign:'center',marginTop:10}}>
        {allChecked?'Все шаги выполнены':`Отмечено ${done.length} из ${items.length}`}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// PROGRESS
// ═══════════════════════════════════════════════════════════
function Progress({state,nav}){
  const streak=computeStreak(state.sessions);
  const daysWithAny=new Set(state.sessions.map(s=>s.date));
  const totalMin=state.sessions.filter(s=>s.type==='fa').reduce((a,s)=>a+(s.minutes||0),0);
  const totalReturns=state.sessions.reduce((a,s)=>a+(s.returns||0),0);
  // neural trigger formation: 21-day horizon
  const uniqueDays=daysWithAny.size;
  const triggerPct=Math.min(1,uniqueDays/21);

  // last 21 days grid
  const cells=[];
  for(let i=20;i>=0;i--){
    const d=new Date(todayISO()); d.setDate(d.getDate()-i);
    const iso=todayISO(d);
    cells.push({iso,active:daysWithAny.has(iso),isToday:iso===todayISO()});
  }

  return (
    <div style={{padding:'8px 20px 40px'}}>
      <TopBar title="Прогресс" onBack={()=>nav('home')}/>

      {/* Neural trigger progress */}
      <Card style={{marginBottom:16,background:`linear-gradient(135deg, ${ACCENT.dim} 0%, ${DS.s1} 65%)`,borderColor:ACCENT.dim2}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
          <div style={{fontSize:15,fontWeight:700}}>Формирование триггера</div>
          <div style={{fontSize:13,color:ACCENT.hex,fontWeight:700}}>{uniqueDays} / 21 дн.</div>
        </div>
        <div style={{height:10,borderRadius:6,background:'rgba(255,255,255,0.08)',marginTop:12,overflow:'hidden'}}>
          <div style={{height:'100%',width:`${triggerPct*100}%`,borderRadius:6,
            background:`linear-gradient(90deg, ${ACCENT.deep}, ${ACCENT.hex})`,transition:'width .6s'}}/>
        </div>
        <div style={{fontSize:12,color:DS.sub,marginTop:12,lineHeight:1.5}}>
          {uniqueDays>=21
            ? 'Триггер закреплён 🎉 Ритуал и фокус теперь работают почти автоматически.'
            : `2–3 недели повторений создают устойчивый нейронный триггер. Осталось ${21-uniqueDays} ${plural(21-uniqueDays,'день','дня','дней')}.`}
        </div>
      </Card>

      {/* Stats row */}
      <div style={{display:'flex',gap:12,marginBottom:16}}>
        <Stat value={streak} label={plural(streak,'день','дня','дней')+' подряд'}/>
        <Stat value={totalMin} label="минут фокуса"/>
        <Stat value={totalReturns} label="подходов"/>
      </div>

      {/* 21-day grid */}
      <div style={{fontSize:12,fontWeight:700,color:DS.muted,letterSpacing:'0.08em',
        textTransform:'uppercase',margin:'6px 2px 12px'}}>Последние 3 недели</div>
      <Card style={{marginBottom:16}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:8}}>
          {cells.map((c,i)=>(
            <div key={i} title={c.iso} style={{aspectRatio:'1',borderRadius:9,
              background:c.active?ACCENT.hex:DS.s3,
              border:c.isToday?`1.5px solid ${ACCENT.hex}`:`1px solid ${DS.border}`,
              opacity:c.active?1:0.5,
              display:'flex',alignItems:'center',justifyContent:'center'}}>
              {c.active&&<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke={ACCENT.on} strokeWidth="3.4" strokeLinecap="round" strokeLinejoin="round"/></svg>}
            </div>
          ))}
        </div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:DS.muted,marginTop:12}}>
          <span>3 недели назад</span><span>Сегодня</span>
        </div>
      </Card>

      {/* Session log */}
      <div style={{fontSize:12,fontWeight:700,color:DS.muted,letterSpacing:'0.08em',
        textTransform:'uppercase',margin:'6px 2px 12px'}}>Журнал</div>
      {state.sessions.length===0 && (
        <div style={{fontSize:13,color:DS.sub,textAlign:'center',padding:'24px 0'}}>
          Пока пусто. Завершите первую практику — она появится здесь.
        </div>
      )}
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {[...state.sessions].reverse().slice(0,12).map((s,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',
            borderRadius:14,background:DS.s1,border:`1px solid ${DS.border}`}}>
            <div style={{fontSize:18,width:26,textAlign:'center'}}>{s.type==='fa'?'🧘':'⚓'}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:13.5,fontWeight:600}}>{s.type==='fa'?'Направленное внимание':'Якорь входа'}</div>
              <div style={{fontSize:11.5,color:DS.muted}}>{fmtDate(s.date)}</div>
            </div>
            <div style={{fontSize:12.5,color:DS.sub}}>
              {s.minutes} мин{s.type==='fa'?` · ${s.returns||0} подх.`:''}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
function fmtDate(iso){
  const d=new Date(iso), t=todayISO();
  if(iso===t) return 'Сегодня';
  const y=new Date(t); y.setDate(y.getDate()-1);
  if(iso===todayISO(y)) return 'Вчера';
  const months=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return `${d.getDate()} ${months[d.getMonth()]}`;
}

// ═══════════════════════════════════════════════════════════
// App root
// ═══════════════════════════════════════════════════════════
function App(){
  const [state,setState]=React.useState(loadState);
  const [screen,setScreen]=React.useState('home');
  const [ctx,setCtx]=React.useState({});
  const [duration,setDuration]=React.useState(suggestedMinutes(loadState().startDate));

  React.useEffect(()=>saveState(state),[state]);

  const nav=(s,c={})=>{ setCtx(c); setScreen(s); document.getElementById('scroll')?.scrollTo(0,0); };

  const addSession=(sess)=>setState(st=>({...st,sessions:[...st.sessions,{date:todayISO(),...sess}]}));
  const setAnchor=(a)=>setState(st=>({...st,anchor:a}));

  let content;
  switch(screen){
    case 'home': content=<Home state={state} nav={nav}/>; break;
    case 'fa-intro': content=<FAIntro state={state} nav={nav} duration={duration} setDuration={setDuration}/>; break;
    case 'fa-session': content=<FASession duration={duration} nav={nav} onFinish={(r)=>addSession({type:'fa',...r})}/>; break;
    case 'fa-done': content=<FADone ctx={ctx} nav={nav}/>; break;
    case 'anchor-intro': content=<AnchorIntro state={state} setAnchor={setAnchor} nav={nav}/>; break;
    case 'anchor-run': content=<AnchorRun state={state} nav={nav} onFinish={(r)=>addSession({type:'anchor',...r})}/>; break;
    case 'progress': content=<Progress state={state} nav={nav}/>; break;
    default: content=<Home state={state} nav={nav}/>;
  }

  return (
    <div style={{position:'relative',zIndex:1}}>
      <IOSDevice>
        <div id="scroll" style={{height:'100%'}}>{content}</div>
      </IOSDevice>
    </div>
  );
}

function boot(){
  if(!window.React||!window.ReactDOM){ setTimeout(boot,40); return; }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
boot();
</script>
</body>
</html>
