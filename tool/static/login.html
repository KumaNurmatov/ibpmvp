<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход</title>
<style>
  :root { --bg:#fbfbfa; --card:#fff; --ink:#1a1a18; --muted:#6b6b66; --line:#e4e4e0;
          --accent:#2b5fd9; --bad:#b00020; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#17171a; --card:#1f1f23; --ink:#ededea;
      --muted:#9b9b95; --line:#32323a; --accent:#7fa0f0; --bad:#f08a9b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
    color:var(--ink); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:28px; width:min(380px, calc(100vw - 32px)); }
  h1 { font-size:19px; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 18px; font-size:14px; }
  input, button { font:inherit; width:100%; padding:11px 13px; border-radius:9px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  button { margin-top:10px; background:var(--accent); border-color:var(--accent);
    color:#fff; cursor:pointer; }
  .err { color:var(--bad); font-size:14px; margin:0 0 12px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Разбор документов по заказам</h1>
  <p>Доступ по паролю.</p>
  <p class="err" id="err" hidden>Неверный пароль.</p>
  <input type="password" name="token" placeholder="Пароль" autofocus autocomplete="current-password">
  <button type="submit">Войти</button>
</form>
<script>
  if (new URLSearchParams(location.search).has("e")) document.getElementById("err").hidden = false;
</script>
</body>
</html>
