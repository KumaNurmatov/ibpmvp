# Публикация браузерной версии на GitHub Pages.
# Статика раздаётся как есть: сборки нет, сервера нет, платить не за что.
name: Опубликовать страницу

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  # Чтобы выложить с рабочей ветки, не дожидаясь слияния в main.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные выкладки затирают друг друга; в очереди держим последнюю.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Проверить расчёты
        # Те же цифры, что в питоновских тестах: порт не должен разойтись.
        run: node --test "web/tests/*.test.js"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Проставить версию на страницу
        # Браузер держит модули в кэше, и свежая страница от старой внешне
        # неотличима. Отметка в подвале позволяет это сразу увидеть.
        #
        # Отсутствие плейсхолдера выкладку не роняет: страница без отметки
        # неудобна, но работает, а вот невыложенная не работает вовсе. Ровно
        # на этом публикация и сломалась — grep не нашёл плейсхолдер в
        # index.html после того, как тот стал дашбордом, и вернул 1.
        run: |
          set -uo pipefail
          stamp="$(git rev-parse --short HEAD) от $(date -u +%d.%m.%Y' '%H:%M) UTC"
          files=$(grep -rl 'версия: из исходников' web --include='*.html' --include='*.js' || true)
          if [ -z "$files" ]; then
            echo "::warning::отметка версии не найдена — страницы выложатся без неё"
          else
            echo "$files" | xargs sed -i "s|версия: из исходников|версия: ${stamp}|"
            echo "Проставлено в: $files"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
