# GitHub как база и как исполнитель: документы кладутся в inbox/, результат
# коммитится в orders/. Платить не за что — счёт идёт в минутах Actions,
# а разбор пачки занимает их единицы.
name: Разбор документов из inbox

on:
  push:
    paths:
      - "inbox/**"
  workflow_dispatch:
    inputs:
      folder:
        description: "Какую папку в inbox/ разобрать (пусто — всю)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # Два пуша подряд не должны коммитить книгу поверх друг друга.
  group: inbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tool/requirements.txt

      - name: Поставить poppler
        # Без него pdftotext и pdftoppm отсутствуют, и сканы читаются как пустые.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Поставить зависимости
        run: pip install -r tool/requirements.txt

      - name: Восстановить кэш распознавания
        # Кэш по хэшу файла: повторный прогон той же пачки не стоит ничего.
        uses: actions/cache@v4
        with:
          path: .ibp-cache
          key: ibp-cache-${{ github.run_id }}
          restore-keys: ibp-cache-

      - name: Разобрать
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          target="inbox/${{ github.event.inputs.folder }}"
          [ -d "$target" ] || target="inbox"
          if [ -z "$(find "$target" -type f -not -name '.gitkeep' -print -quit 2>/dev/null)" ]; then
            echo "В $target нет файлов — выходим."
            exit 0
          fi
          mkdir -p orders
          python -m tool.cli "$target" -o "orders/Заказы.xlsx" \
                 --json "orders/Заказы.json" --cache .ibp-cache

      - name: Закоммитить результат
        run: |
          set -euo pipefail
          if git diff --quiet -- orders; then
            echo "Книга не изменилась."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orders
          git commit -m "Разобрать документы из inbox ($(date -u +%F' '%T) UTC)"
          git push

      - name: Приложить книгу к запуску
        # Чтобы скачать результат, не заходя в репозиторий.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Заказы
          path: orders/
          if-no-files-found: ignore
