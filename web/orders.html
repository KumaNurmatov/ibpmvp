<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заказы</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div class="grow">
      <h1>Заказы</h1>
      <p class="sub" id="updated"></p>
    </div>
    <div class="seg" role="group" aria-label="Вид списка">
      <button id="view-cards" aria-pressed="true">Карточки</button>
      <button id="view-table" aria-pressed="false">Таблица</button>
    </div>
    <button id="csv">Выгрузить CSV</button>
  </div>

  <div id="stages"></div>

  <div class="card">
    <div class="grid c3">
      <div><label for="q">Поиск</label><input id="q" placeholder="договор, заказ, изделие, водитель"></div>
      <div><label for="ws">Цех</label><select id="ws"><option value="">все</option></select></div>
      <div><label for="mo">Месяц отгрузки</label><select id="mo"><option value="">все</option></select></div>
    </div>
    <div class="row-line" style="margin-top:12px">
      <label style="margin:0"><input type="checkbox" id="only" style="width:auto"> только с замечаниями</label>
      <span class="src" id="count"></span>
    </div>
  </div>

  <div class="cards" id="cards"></div>
  <div class="card hide" id="table-box"><table class="wide" id="tbl"></table></div>
</div>

<script type="module">
import { money } from "./lib/ledger.js";
import { photoImg } from "./lib/photo.js";
import { STAGES, stage, stageOf } from "./lib/stages.js";
import { pills } from "./lib/ui.js";
import { dateRu, escapeHtml, fatal, loadOrders, mountShell, qty, severity, showUpdated,
         status, workshopChips } from "./lib/shell.js";

mountShell("orders.html");

const VIEW_KEY = "ibp.ordersView";

// Заголовок строки и карточки — номер договора: заказы ищут по нему, в
// платёжках и CMR стоит он же. Номер заказа идёт подписью.
const COLUMNS = [
  ["contract", "Договор", (o) => `<a href="./order.html?id=${encodeURIComponent(o.key)}">${
      escapeHtml(o.contract_no || o.key)}</a><div class="src">${escapeHtml(o.get("order_no") || "")}</div>`],
  ["item", "Изделие", (o) => escapeHtml(o.get("item") || "—")],
  ["ordered", "Заказано", (o) => qty(o.get("ordered_qty")), "num"],
  ["price", "Цена", (o) => money(o.get("unit_price")), "num"],
  ["shipped", "Отгружено", (o) => qty(o.get("shipped_qty")), "num"],
  ["accepted", "Принято", (o) => accepted(o), "num"],
  ["date", "Отправка", (o) => dateRu(o.get("shipment_date"))],
  ["ship_sum", "Сумма отгрузки", (o) => money(o.computed.shipment_sum), "num"],
  ["paid", "Оплачено", (o) => money(o.computed.paid), "num"],
  ["remainder", "Остаток", (o) => `<b>${money(o.computed.remainder)}</b>`, "num"],
  ["status", "Стадия", (o) => `<span class="pill ${status(o).cls}">${status(o).name}</span>`],
];

const VALUE = {
  contract: (o) => o.contract_no || o.key,
  item: (o) => o.get("item") || "",
  ordered: (o) => o.get("ordered_qty") ?? -1,
  price: (o) => o.get("unit_price") ?? -1,
  shipped: (o) => o.get("shipped_qty") ?? -1,
  accepted: (o) => o.computed.accepted_qty ?? -1,
  date: (o) => o.get("shipment_date") || "",
  ship_sum: (o) => o.computed.shipment_sum ?? -1,
  paid: (o) => o.computed.paid ?? -1,
  remainder: (o) => o.computed.remainder ?? -1,
  status: (o) => status(o).name,
};

let all = [];
let sort = { key: "date", dir: -1 };
let view = readView();
let stageKey = new URLSearchParams(location.search).get("stage") || "";

try {
  const { data, orders } = await loadOrders();
  all = orders;
  showUpdated(document.querySelector("#updated"), data?.updated);
  fillFilters(orders);
  drawStages(orders);
  for (const id of ["q", "ws", "mo", "only"]) {
    document.querySelector(`#${id}`).addEventListener("input", draw);
  }
  document.querySelector("#csv").addEventListener("click", exportCsv);
  document.querySelector("#view-cards").onclick = () => setView("cards");
  document.querySelector("#view-table").onclick = () => setView("table");
  draw();
} catch (err) {
  fatal(`Не удалось загрузить данные: ${err.message}`);
}

function fillFilters(orders) {
  const add = (sel, values) => {
    const node = document.querySelector(sel);
    for (const v of [...new Set(values)].filter(Boolean).sort()) {
      node.append(new Option(v, v));
    }
  };
  add("#ws", orders.flatMap((o) => o.workshops));
  add("#mo", orders.map((o) => (o.get("shipment_date") || "").slice(0, 7)));
}

/**
 * Стадии — ряд пилюль со счётчиками. В выпадающем списке не было видно ни
 * самих стадий, ни того, сколько в какой; со ступени воронки на дашборде
 * приходят с ?stage=… и сразу попадают на нужную пилюлю.
 */
function drawStages(orders) {
  const counts = new Map(STAGES.map((s) => [s.key, 0]));
  for (const o of orders) counts.set(stageOf(o), (counts.get(stageOf(o)) || 0) + 1);

  const items = [{ key: "", name: "Все", count: orders.length },
                 ...STAGES.map((s) => ({ key: s.key, name: s.name, count: counts.get(s.key), cls: s.cls }))];
  document.querySelector("#stages").innerHTML = pills(items, { current: stageKey });

  for (const button of document.querySelectorAll("[data-pill]")) {
    button.onclick = () => {
      stageKey = button.dataset.pill;
      for (const b of document.querySelectorAll("[data-pill]")) {
        b.setAttribute("aria-pressed", String(b.dataset.pill === stageKey));
      }
      draw();
    };
  }
}

function filtered() {
  const q = document.querySelector("#q").value.trim().toLowerCase();
  const ws = document.querySelector("#ws").value;
  const mo = document.querySelector("#mo").value;
  const only = document.querySelector("#only").checked;

  return all.filter((o) => {
    if (stageKey && stageOf(o) !== stageKey) return false;
    if (ws && !o.workshops.includes(ws)) return false;
    if (mo && !(o.get("shipment_date") || "").startsWith(mo)) return false;
    if (only && !severity(o)) return false;
    if (!q) return true;
    const hay = [o.contract_no, o.get("order_no"), o.get("item"), o.get("driver"),
                 o.workshops.join(" "), o.get("item_article"), o.get("tnved")].join(" ").toLowerCase();
    return hay.includes(q);
  }).sort((a, b) => {
    const x = VALUE[sort.key](a), y = VALUE[sort.key](b);
    const cmp = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "ru");
    return cmp * sort.dir;
  });
}

function draw() {
  const rows = filtered();
  const debt = rows.reduce((s, o) => s + (o.computed.remainder || 0), 0);
  document.querySelector("#count").textContent =
    `${rows.length} из ${all.length} · остаток ${money(debt)}`;

  document.querySelector("#cards").classList.toggle("hide", view !== "cards");
  document.querySelector("#table-box").classList.toggle("hide", view !== "table");
  document.querySelector("#view-cards").setAttribute("aria-pressed", String(view === "cards"));
  document.querySelector("#view-table").setAttribute("aria-pressed", String(view === "table"));

  if (view === "cards") drawCards(rows); else drawTable(rows);
}

/**
 * Карточка заказа. Сверху стадия, под ней номер договора и отгрузка в
 * деньгах, справа силуэт изделия, внизу — чем закончилась оплата: полоса и
 * доля. Порядок такой же, как смотрят глазами: что за заказ → на сколько →
 * сколько пришло.
 */
function drawCards(rows) {
  document.querySelector("#cards").innerHTML = rows.length
    ? rows.map((o) => {
        const c = o.computed;
        const st = status(o);
        const done = c.shipment_sum ? Math.min(1, Math.max(0, c.paid / c.shipment_sum)) : 0;
        const bar = done >= 0.999 ? "" : done > 0 ? "part" : "none";
        return `<a class="ocard" href="./order.html?id=${encodeURIComponent(o.key)}">
          <div class="top">
            <span class="pill ${st.cls}">${st.name}</span>
            ${o.workshops.length ? `<span class="chips">${workshopChips(o)}</span>` : ""}
          </div>
          <div class="face">
            <div>
              <div class="no">${escapeHtml(o.contract_no || o.key)}</div>
              <div class="sub2">${money(c.shipment_sum)} · ${qty(o.get("shipped_qty"))} шт</div>
              <div class="what">${escapeHtml(o.get("order_no") || "")} ·
                ${escapeHtml(o.get("item") || "изделие не указано")}</div>
            </div>
            ${photoImg(o, { className: "shot" })}
          </div>
          <div class="meta">
            <span>отправка ${dateRu(o.get("shipment_date"))}</span>
            <span>${acceptedShort(o)}</span>
            <span${(c.remainder || 0) > 0.5 ? ' style="color:var(--bad)"' : ""}>остаток ${money(c.remainder)}</span>
          </div>
          <div class="prog"><span>Оплачено</span>
            <b>${money(c.paid)} · ${(done * 100).toFixed(0)}%</b></div>
          <div class="bar ${bar}"><i style="width:${(done * 100).toFixed(1)}%"></i></div>
        </a>`;
      }).join("")
    : '<div class="card src">Ничего не нашлось.</div>';
}

function drawTable(rows) {
  const head = COLUMNS.map(([key, name, , cls]) =>
    `<th class="sortable ${cls || ""}" data-key="${key}">${name}${
      sort.key === key ? (sort.dir > 0 ? " ↑" : " ↓") : ""}</th>`).join("");

  const body = rows.length
    ? rows.map((o) => `<tr class="row">${COLUMNS.map(([, , render, cls]) =>
        `<td class="${cls || ""}">${render(o)}</td>`).join("")}</tr>`).join("")
    : `<tr><td colspan="${COLUMNS.length}" class="src">Ничего не нашлось.</td></tr>`;

  const table = document.querySelector("#tbl");
  table.innerHTML = `<tr>${head}</tr>${body}`;
  for (const th of table.querySelectorAll("th.sortable")) {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      sort = { key, dir: sort.key === key ? -sort.dir : 1 };
      draw();
    });
  }
}

function accepted(o) {
  const c = o.computed;
  if (c.accepted_qty === null && c.rejected_qty === null) return '<span class="src">не отмечено</span>';
  return `${qty(c.accepted_qty)}${c.rejected_qty ? `<div class="src">не принято ${qty(c.rejected_qty)}</div>` : ""}`;
}

function acceptedShort(o) {
  const c = o.computed;
  if (c.rejected_qty === null) return "приёмка не отмечена";
  if (!c.rejected_qty) return "принято полностью";
  return `не принято ${qty(c.rejected_qty)} шт`;
}

function setView(next) {
  view = next;
  try { localStorage.setItem(VIEW_KEY, next); } catch { /* приватное окно */ }
  draw();
}

function readView() {
  try { return localStorage.getItem(VIEW_KEY) === "table" ? "table" : "cards"; } catch { return "cards"; }
}

function exportCsv() {
  const rows = filtered();
  const header = ["Договор", "Заказ", "Дата заказа", "Изделие", "ТН ВЭД", "Заказано", "Цена",
                  "Отгружено", "Принято", "Не принято", "Причина", "Отправка",
                  "Сумма отгрузки", "Оплачено", "Остаток", "Стадия", "Цеха"];
  const lines = [header, ...rows.map((o) => [
    o.contract_no || o.key, o.get("order_no") || "", o.get("order_date") || "",
    o.get("item") || "", o.get("tnved") || "",
    o.get("ordered_qty") ?? "", o.get("unit_price") ?? "", o.get("shipped_qty") ?? "",
    o.computed.accepted_qty ?? "", o.computed.rejected_qty ?? "", o.get("reject_reason") || "",
    o.get("shipment_date") || "", o.computed.shipment_sum ?? "", o.computed.paid ?? "",
    o.computed.remainder ?? "", status(o).name, o.workshops.join(", "),
  ])];
  // Точка с запятой и BOM: иначе Excel в русской локали сложит всё в один столбец.
  const csv = "﻿" + lines.map((r) => r.map(cell).join(";")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "Заказы.csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

const cell = (v) => {
  const s = String(v ?? "");
  return /[";\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
};
</script>
</body>
</html>
