<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Документы</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div class="grow">
      <h1>Документы</h1>
      <p class="sub">Договоры, спецификации, заказы, учёт и отправки по каждому договору.
        Смотреть и скачивать можно прямо здесь, папку целиком — в Google Drive.</p>
    </div>
  </div>

  <div class="card">
    <label for="q">Поиск</label>
    <input id="q" placeholder="номер договора, заказа, изделие или название файла">
    <div class="chips" id="kinds" style="margin-top:12px"></div>
    <div class="row-line" style="margin-top:12px">
      <label style="margin:0"><input type="checkbox" id="empty" style="width:auto"> показать договоры без документов</label>
      <span class="src" id="count"></span>
    </div>
  </div>

  <div class="cards" id="cards"></div>

</div>

<script type="module">
import { DOC_KINDS, docsOf, haystack } from "./lib/documents.js";
import { bindDocs, docsHtml } from "./lib/docview.js";
import { escapeHtml, fatal, loadOrders, mountShell } from "./lib/shell.js";

mountShell("documents.html");

/** «1 договор», «3 договора», «5 договоров» — формы слова по числу. */
const plural = (n, [one, few, many]) =>
  (n % 10 === 1 && n % 100 !== 11 ? one
    : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? few : many);

let rows = [];          // [{ order, docs, folder, hay }]
let kind = "";          // выбранный вид документа; "" — все

const params = new URLSearchParams(location.search);
document.querySelector("#q").value = params.get("q") || "";

try {
  const { orders } = await loadOrders();
  rows = orders.map((order) => {
    // Папка договора — не ещё один документ, а место, где лежат все: у неё
    // своя строка внизу карточки.
    const all = docsOf(order);
    return { order, docs: all.filter((d) => !d.folder), folder: all.find((d) => d.folder), hay: haystack(order, all) };
  }).sort((a, b) => String(b.order.get("order_date") || "").localeCompare(String(a.order.get("order_date") || ""))
    || String(b.order.contract_no).localeCompare(String(a.order.contract_no), "ru", { numeric: true }));
  drawKinds();
  document.querySelector("#q").addEventListener("input", draw);
  document.querySelector("#empty").addEventListener("input", draw);
  draw();
} catch (err) {
  fatal(`Не удалось загрузить данные: ${err.message}`);
}

function drawKinds() {
  const counts = new Map();
  for (const { docs } of rows) for (const d of docs) counts.set(d.kind, (counts.get(d.kind) || 0) + 1);
  const options = [["", "Все"], ...DOC_KINDS.filter(([key]) => key !== "папка" && counts.has(key))];
  const box = document.querySelector("#kinds");
  box.innerHTML = options.map(([key, name]) => `<button type="button" class="chip pick" data-kind="${key}"
      aria-pressed="${key === kind}">${name}${key ? ` · ${counts.get(key)}` : ""}</button>`).join("");
  for (const b of box.querySelectorAll("[data-kind]")) {
    b.onclick = () => { kind = b.dataset.kind; drawKinds(); draw(); };
  }
}

function draw() {
  const q = document.querySelector("#q").value.trim().toLowerCase().replace(/ё/g, "е");
  const withEmpty = document.querySelector("#empty").checked;
  const shown = rows
    .map((r) => ({ ...r, docs: kind ? r.docs.filter((d) => d.kind === kind) : r.docs }))
    .filter((r) => (!q || r.hay.includes(q)) && (r.docs.length || (!kind && (r.folder || withEmpty))));
  const files = shown.reduce((s, r) => s + r.docs.length, 0);
  document.querySelector("#count").textContent = `${shown.length} ${plural(shown.length, ["договор", "договора", "договоров"])} · ${files} ${plural(files, ["документ", "документа", "документов"])}`;

  document.querySelector("#cards").innerHTML = shown.length
    ? shown.map(card).join("")
    : '<div class="card src">Ничего не нашлось.</div>';

  bindDocs(document.querySelector("#cards"), shown);
}

/**
 * Карточка договора: номер и изделие сверху, ниже документы по видам —
 * у каждого «смотреть» и «скачать», внизу папка договора. Папку целиком
 * архивом отдаёт только сам Drive: сайт собрать архив из файлов Drive не
 * может, Google не даёт чужим страницам читать файлы.
 */
function card({ order: o, docs, folder }, i) {
  return `<div class="dcard">
    <div>
      <a class="no" href="./order.html?id=${encodeURIComponent(o.key)}">${escapeHtml(o.contract_no || o.key)}</a>
      <div class="what">${escapeHtml(o.get("order_no") || "")} · ${escapeHtml(o.get("item") || "изделие не указано")}</div>
    </div>
    ${docsHtml(docs, folder, i)}
  </div>`;
}


</script>
</body>
</html>
