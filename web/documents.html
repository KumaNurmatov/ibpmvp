<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Документы</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div class="grow">
      <h1>Документы</h1>
      <p class="sub">Договоры, спецификации, заказы, учёт и отправки по каждому договору.
        Смотреть и скачивать можно прямо здесь.</p>
    </div>
  </div>

  <div class="card">
    <label for="q">Поиск</label>
    <input id="q" placeholder="номер договора, заказа, изделие или название файла">
    <div class="chips" id="kinds" style="margin-top:12px"></div>
    <div class="row-line" style="margin-top:12px">
      <label style="margin:0"><input type="checkbox" id="empty" style="width:auto"> показать договоры без документов</label>
      <span class="src" id="count"></span>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="overlay hide" id="view-box">
    <div class="sheet-view">
      <div class="row-line">
        <b id="view-title"></b>
        <a class="btn primary" id="view-save" style="margin-left:auto">Скачать</a>
        <a class="btn" id="view-open" target="_blank" rel="noopener">Открыть в Drive ↗</a>
        <button id="view-close">Закрыть</button>
      </div>
      <iframe id="view-frame" title="Просмотр документа" allow="autoplay"></iframe>
    </div>
  </div>
</div>

<script type="module">
import { DOC_KINDS, docsOf, haystack, kindName } from "./lib/documents.js";
import { escapeHtml, fatal, loadOrders, mountShell } from "./lib/shell.js";

mountShell("documents.html");

// Объявлены до первой отрисовки: страница рисуется сразу после загрузки данных.
const EYE = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 15a3 3 0 100-6 3 3 0 000 6"/></svg>`;
const DOWN = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>`;

/** «1 файл», «3 файла», «5 файлов» — формы слова по числу. */
const plural = (n, [one, few, many] = ["файл", "файла", "файлов"]) =>
  (n % 10 === 1 && n % 100 !== 11 ? one
    : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? few : many);

let rows = [];          // [{ order, docs, hay }]
let kind = "";          // выбранный вид документа; "" — все

const params = new URLSearchParams(location.search);
document.querySelector("#q").value = params.get("q") || "";

try {
  const { orders } = await loadOrders();
  rows = orders.map((order) => {
    const docs = docsOf(order);
    return { order, docs, hay: haystack(order, docs) };
  }).sort((a, b) => String(b.order.get("order_date") || "").localeCompare(String(a.order.get("order_date") || ""))
    || String(b.order.contract_no).localeCompare(String(a.order.contract_no), "ru", { numeric: true }));
  drawKinds();
  document.querySelector("#q").addEventListener("input", draw);
  document.querySelector("#empty").addEventListener("input", draw);
  document.querySelector("#view-close").onclick = closeView;
  document.querySelector("#view-box").addEventListener("click", (e) => { if (e.target.id === "view-box") closeView(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeView(); });
  draw();
} catch (err) {
  fatal(`Не удалось загрузить данные: ${err.message}`);
}

function drawKinds() {
  const counts = new Map();
  for (const { docs } of rows) for (const d of docs) counts.set(d.kind, (counts.get(d.kind) || 0) + 1);
  const options = [["", "Все"], ...DOC_KINDS.filter(([key]) => counts.has(key))];
  const box = document.querySelector("#kinds");
  box.innerHTML = options.map(([key, name]) => `<button type="button" class="chip pick" data-kind="${key}"
      aria-pressed="${key === kind}">${name}${key ? ` · ${counts.get(key)}` : ""}</button>`).join("");
  for (const b of box.querySelectorAll("[data-kind]")) {
    b.onclick = () => { kind = b.dataset.kind; drawKinds(); draw(); };
  }
}

function draw() {
  const q = document.querySelector("#q").value.trim().toLowerCase().replace(/ё/g, "е");
  const withEmpty = document.querySelector("#empty").checked;
  const shown = rows
    .map((r) => ({ ...r, docs: kind ? r.docs.filter((d) => d.kind === kind) : r.docs }))
    .filter((r) => (!q || r.hay.includes(q)) && (r.docs.length || (withEmpty && !kind)));
  const files = shown.reduce((s, r) => s + r.docs.length, 0);
  document.querySelector("#count").textContent = `${shown.length} ${plural(shown.length, ["договор", "договора", "договоров"])} · ${files} ${plural(files, ["документ", "документа", "документов"])}`;

  document.querySelector("#cards").innerHTML = shown.length
    ? shown.map(card).join("")
    : '<div class="card src">Ничего не нашлось.</div>';

  for (const b of document.querySelectorAll("[data-view]")) {
    const [i, j] = b.dataset.view.split(":").map(Number);
    b.onclick = () => openView(shown[i].docs[j]);
  }
  for (const b of document.querySelectorAll("[data-all]")) {
    b.onclick = () => downloadEach(shown[+b.dataset.all].docs.filter((d) => d.download), b);
  }
}

/**
 * Карточка договора: номер и изделие сверху, ниже документы по видам —
 * у каждого «смотреть» и «скачать», внизу одна кнопка на все сразу.
 */
function card({ order: o, docs }, i) {
  const files = docs.filter((d) => d.download);
  const folder = docs.find((d) => d.folder);
  return `<div class="dcard">
    <div>
      <a class="no" href="./order.html?id=${encodeURIComponent(o.key)}">${escapeHtml(o.contract_no || o.key)}</a>
      <div class="what">${escapeHtml(o.get("order_no") || "")} · ${escapeHtml(o.get("item") || "изделие не указано")}</div>
    </div>
    ${docs.length ? `<ul class="dlist">${docs.map((d, j) => `<li>
        <span class="kind">${kindName(d.kind)}</span>
        ${d.preview
          ? `<button type="button" class="name" data-view="${i}:${j}" title="${escapeHtml(d.title)}">${escapeHtml(d.title)}</button>`
          : `<a class="name" href="${escapeHtml(d.url)}" target="_blank" rel="noopener" title="${escapeHtml(d.title)}">${escapeHtml(d.title)} ↗</a>`}
        <span class="acts">
          ${d.preview ? `<button type="button" class="icon" data-view="${i}:${j}" title="Смотреть" aria-label="Смотреть">${EYE}</button>` : ""}
          ${d.download ? `<a class="btn icon" href="${escapeHtml(d.download)}" title="Скачать" aria-label="Скачать">${DOWN}</a>`
            : d.folder ? `<a class="btn icon" href="${escapeHtml(d.url)}" target="_blank" rel="noopener"
                title="Открыть папку в Drive: там она скачивается архивом" aria-label="Открыть папку">${DOWN}</a>` : ""}
        </span>
      </li>`).join("")}</ul>` : '<p class="src" style="margin:0">Документов нет — ссылки добавляются в карточке заказа.</p>'}
    ${files.length > 1 || folder ? `<details class="dl-all">
      <summary class="btn">Скачать все</summary>
      <div class="menu">
        ${files.length ? `<button type="button" data-all="${i}">По отдельности · ${files.length} ${plural(files.length)}</button>` : ""}
        ${folder ? `<a class="btn" href="${escapeHtml(folder.url)}" target="_blank" rel="noopener">Одним архивом — папка в Drive ↗</a>
          <span class="src">В папке нажмите «Скачать» — Drive соберёт ZIP сам.</span>`
          : `<button type="button" disabled>Одним архивом</button>
          <span class="src">Архив появится, когда у договора будет ссылка на его папку в Drive.</span>`}
      </div>
    </details>` : ""}
  </div>`;
}

/**
 * Скачать файлы по одному. Файл с Drive по ссылке скачивания сразу уходит в
 * загрузки, страница остаётся на месте. Пауза между файлами нужна, иначе
 * следующий переход отменяет ещё не начавшуюся загрузку предыдущего; браузер
 * один раз спросит, можно ли этому сайту скачивать несколько файлов.
 */
async function downloadEach(files, button) {
  const label = button.textContent;
  button.disabled = true;
  for (const [n, d] of files.entries()) {
    button.textContent = `Скачиваю ${n + 1} из ${files.length}…`;
    const a = document.createElement("a");
    a.href = d.download;
    document.body.append(a);
    a.click();
    a.remove();
    await new Promise((done) => setTimeout(done, 1500));
  }
  button.textContent = label;
  button.disabled = false;
}

function openView(d) {
  document.querySelector("#view-title").textContent = `${kindName(d.kind)}: ${d.title}`;
  document.querySelector("#view-frame").src = d.preview;
  document.querySelector("#view-open").href = d.url;
  const save = document.querySelector("#view-save");
  save.classList.toggle("hide", !d.download);
  if (d.download) save.href = d.download;
  document.querySelector("#view-box").classList.remove("hide");
}

function closeView() {
  document.querySelector("#view-box").classList.add("hide");
  document.querySelector("#view-frame").src = "about:blank";
}

</script>
</body>
</html>
