<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточка заказа</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./styles.css">
<style>
  /* Расчёт показываем с формулой: видно, откуда взялась цифра, как в таблице. */
  .calc td:first-child { color: var(--muted); }
  .calc .formula { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .calc tr.total td { border-top: 2px solid var(--axis); font-size: 16px; }
  .links a { display: inline-block; margin: 0 10px 8px 0; }
  .acc { display: grid; gap: 16px; margin-bottom: 14px; }
  .acc-rings { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .acc-rings .src { margin-right: 18px; line-height: 1.3; }
  .hero { width: 54px; height: 40px; border-radius: 9px; object-fit: contain; background: var(--shot); padding: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="sub"><a href="./orders.html">← ко всем заказам</a></p>
  <div id="body"></div>

  <div class="overlay hide" id="blank-box">
    <div class="sheet-view">
      <div class="row-line">
        <b>Бланк заказа</b>
        <span class="src" id="blank-state"></span>
        <a class="btn primary hide" id="blank-save" style="margin-left:auto">Скачать PDF</a>
        <button id="blank-close">Закрыть</button>
      </div>
      <div class="bl-frame" id="blank-frame"><div class="bl-scale" id="blank-sheet"></div></div>
    </div>
  </div>
</div>

<script type="module">
import { money } from "./lib/ledger.js";
import { photoImg } from "./lib/photo.js";
import { shipmentsOf, shipmentsWith } from "./lib/shipments.js";
import { tasks } from "./lib/stages.js";
import { balanceScale, ring } from "./lib/ui.js";
import { dateRu, escapeHtml, fatal, loadOrders, mountShell, qty, status, workshopChips } from "./lib/shell.js";

mountShell("orders.html");

const id = new URLSearchParams(location.search).get("id");

try {
  const { data, orders } = await loadOrders();
  const order = orders.find((o) => o.key === id);
  // Машина, в которой заказ уехал: документы на доставку и оплата карго общие
  // на всю отгрузку, и ходить за ними через список — лишний шаг.
  const [ride] = shipmentsWith(shipmentsOf(data, orders), id);
  if (!order) {
    fatal(`Заказ «${id || "без номера"}» не найден.`);
  } else {
    document.title = `${order.get("order_no") || order.key} — карточка заказа`;
    render(order, ride);
    document.querySelector("#blank").onclick = () => showBlank(order);
    document.querySelector("#blank-close").onclick = () =>
      document.querySelector("#blank-box").classList.add("hide");
  }
} catch (err) {
  fatal(`Не удалось загрузить данные: ${err.message}`);
}

function render(o, ride) {
  const c = o.computed;
  const st = status(o);
  const price = o.get("unit_price");
  const edit = `<button id="blank">Скачать бланк</button>
    <a class="btn" href="./admin.html?id=${encodeURIComponent(o.key)}">Править</a>`;

  document.querySelector("#body").innerHTML = `
    <div class="row-line" style="margin-bottom:6px">
      ${photoImg(o, { className: "hero" })}
      <h1 style="margin:0">${escapeHtml(o.contract_no || o.key)}</h1>
      <span class="pill">заказ ${escapeHtml(o.get("order_no") || "—")}</span>
      <span class="pill ${st.cls}">${st.name}</span>
      <span class="row-line" style="margin-left:auto">${edit}</span>
    </div>
    <p class="sub">${escapeHtml(o.get("item") || "изделие не указано")}${
      o.get("item_article") ? ` · арт. ${escapeHtml(o.get("item_article"))}` : ""}${
      o.get("tnved") ? ` · ТН ВЭД ${escapeHtml(o.get("tnved"))}` : ""}${
      o.get("order_date") ? ` · заказ от ${dateRu(o.get("order_date"))}` : ""}</p>
    ${o.workshops.length ? `<div class="chips" style="margin:-10px 0 18px">${workshopChips(o)}</div>` : ""}

    ${todo(o)}

    <div class="tiles">
      ${tile("Сумма заказа", money(c.order_sum), `${qty(o.get("ordered_qty"))} × ${money(price)}`)}
      ${tile("Сумма отгрузки", money(c.shipment_sum), `${qty(o.get("shipped_qty"))} × ${money(price)}`)}
      ${tile("Оплачено", money(c.paid), `${o.payments.length} ${plural(o.payments.length)}`)}
      ${tile("Остаток", money(c.remainder),
             c.remainder_units != null ? `≈ ${qty(c.remainder_units)} шт` : "нет данных об отгрузке",
             (c.remainder || 0) > 0.5 ? "bad" : (c.remainder === 0 ? "ok" : ""))}
    </div>

    <h2>Заказ</h2>
    <div class="card"><table>
      <tr><th>Заказано</th><td>${qty(o.get("ordered_qty"))} шт</td>
          <th>Цена пошива</th><td>${money(price)}</td></tr>
      <tr><th>ТН ВЭД</th><td>${escapeHtml(o.get("tnved") || "—")}</td>
          <th>Артикул</th><td>${escapeHtml(o.get("item_article") || "—")}</td></tr>
      <tr><th>Цех</th><td colspan="3">${o.workshops.length
            ? `<span class="chips">${workshopChips(o)}</span>` : "—"}</td></tr>
      <tr><th>Сумма заказа</th><td colspan="3"><b>${money(c.order_sum)}</b>
          <span class="src">${qty(o.get("ordered_qty"))} шт × ${money(price)}</span></td></tr>
    </table></div>

    <h2>Отправка</h2>
    <div class="card"><table>
      ${ride ? `<tr><th>Отгрузка</th><td colspan="3">
        <a href="./shipment.html?id=${encodeURIComponent(ride.id)}">вся машина от ${
          dateRu(ride.date)} ↗</a>
        <span class="src">${ride.totals.orders > 1
          ? `в этот день уехали ещё ${ride.contracts.filter((n) => n !== (o.contract_no || o.key))
              .map(escapeHtml).join(", ")}`
          : "в этот день уехал только этот заказ"}</span></td></tr>` : ""}
      <tr><th>Дата</th><td>${dateRu(o.get("shipment_date"))}</td>
          <th>Мест</th><td>${qty(o.get("places"))}</td></tr>
      <tr><th>Количество</th><td>${qty(o.get("shipped_qty"))} шт</td>
          <th>Вес брутто</th><td>${qty(o.get("weight_gross"))} кг</td></tr>
      <tr><th>Сумма отгрузки</th><td colspan="3"><b>${money(c.shipment_sum)}</b>
          <span class="src">${qty(o.get("shipped_qty"))} шт × ${money(price)}</span></td></tr>
      <tr><th>Водитель</th><td>${escapeHtml(o.get("driver") || "—")}</td>
          <th>Телефон</th><td>${o.get("driver_phone")
            ? `<a href="tel:${escapeHtml(String(o.get("driver_phone")).replace(/[^+\d]/g, ""))}">${
                escapeHtml(o.get("driver_phone"))}</a>` : "—"}</td></tr>
    </table></div>

    <h2>Приёмка</h2>
    <div class="card">${acceptance(o)}</div>

    <h2>Платежи</h2>
    <div class="card">${o.payments.length ? `<table>
      <tr><th>Вид</th><th>Дата</th><th class="num">Сумма</th><th>Документ</th></tr>
      ${o.payments.map((p) => `<tr>
        <td>${escapeHtml(p.kind)}${p.inferred_from
            ? `<div class="src">${escapeHtml(p.inferred_from)}</div>` : ""}</td>
        <td>${dateRu(p.date)}</td>
        <td class="num">${money(p.amount)}</td>
        <td>${escapeHtml(p.doc_number || "—")}${p.purpose
            ? `<div class="src">${escapeHtml(p.purpose)}</div>` : ""}</td></tr>`).join("")}
      </table>` : '<span class="src">Платежей нет.</span>'}</div>

    <h2>Расчёт</h2>
    <div class="card"><table class="calc">
      ${calcRow("Сумма заказа", c.order_sum, `${qty(o.get("ordered_qty"))} шт × ${money(price)}`)}
      ${calcRow("Сумма отгрузки", c.shipment_sum, `${qty(o.get("shipped_qty"))} шт × ${money(price)}`)}
      ${calcRow("Оплачено", c.paid, o.payments.map((p) => money(p.amount)).join(" + ") || "платежей нет")}
      ${c.transfers ? calcRow("Подтверждённые переносы", c.transfers, "со знаком + в заказ, − из него") : ""}
      ${calcRow("Остаток", c.remainder,
                `${money(c.shipment_sum)} − ${money(c.paid)}`, true)}
      ${c.remainder_units != null
        ? calcRow("В штуках по цене пошива", c.remainder_units,
                  `${money(c.remainder)} ÷ ${money(price)}`, false, "шт") : ""}
      ${c.rejected_sum !== null ? calcRow("Непринятое по приёмке", c.rejected_sum,
          `${qty(c.rejected_qty)} шт × ${money(price)}`) : ""}
      ${c.unexplained !== null ? calcRow(
          c.settled ? "Сверх непринятого — ничего" : "Сверх непринятого", c.unexplained,
          `${money(c.remainder)} − ${money(c.rejected_sum)}`, true) : ""}
    </table></div>

    ${o.links.length ? `<h2>Документы</h2><div class="card links">
      ${o.links.map((l) => `<a href="${escapeHtml(l.url)}" target="_blank" rel="noopener">
        ${escapeHtml(l.title)} ↗</a>`).join("")}</div>` : ""}

    ${o.flags.length ? `<h2>Проверки</h2><div class="card">
      ${o.flags.map((f) => `<div class="flag ${f.level}">${escapeHtml(f.message)}</div>`).join("")}
      </div>` : ""}

    ${o.note ? `<h2>Заметка</h2><div class="card">${escapeHtml(o.note)}</div>` : ""}

    <p class="src" style="margin-top:20px">Условия: предоплата ${
      o.terms.prepay_percent ?? 50}%, ${o.terms.lead_time_days
        ? `срок исполнения ${o.terms.lead_time_days} дн.`
        : "срок исполнения не задан"}.${
      c.due_date ? ` Срок сдачи ${dateRu(c.due_date)}.` : ""}</p>
  `;
}

// Объявлениями функций, а не const: render() вызывается выше по файлу, и
// стрелочные константы к тому моменту ещё не инициализированы.
/**
 * Бланк: четыре копии на листе. Показываем сам PDF, а не его подобие в
 * HTML, — что на экране, то и напечатается. Шрифты и сборщик грузятся
 * только по нажатию: это 80 КБ, которые незачем тянуть всем.
 */
async function showBlank(o) {
  const box = document.querySelector("#blank-box");
  const frame = document.querySelector("#blank-frame");
  const save = document.querySelector("#blank-save");
  const state = document.querySelector("#blank-state");

  box.classList.remove("hide");
  state.textContent = "Готовлю бланк…";
  try {
    const [{ loadFonts }, { blankHtml, blankName, blankPdf, fitPreview, PAGE }] =
      await Promise.all([import("./lib/pdf.js"), import("./lib/blank.js")]);

    const sheet = document.querySelector("#blank-sheet");
    sheet.innerHTML = blankHtml(o);
    fitPreview(sheet);
    fit(frame, sheet, PAGE.width);
    window.addEventListener("resize", () => fit(frame, sheet, PAGE.width));

    const bytes = blankPdf(o, await loadFonts());
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    if (save.dataset.url) URL.revokeObjectURL(save.dataset.url);
    save.dataset.url = url;
    save.href = url;
    save.download = blankName(o);
    save.classList.remove("hide");
    state.textContent = "Договор, номер заказа, дата и артикул проставлены во все четыре копии.";
  } catch (err) {
    state.textContent = `Не получилось собрать бланк: ${err.message}`;
  }
}

/** Ужать лист под ширину окна, сохранив печатные пропорции. */
function fit(frame, sheet, widthMm) {
  const pxPerMm = 96 / 25.4;
  const room = frame.clientWidth - 24;
  const k = Math.min(1, room / (widthMm * pxPerMm));
  sheet.style.setProperty("--k", k.toFixed(3));
  sheet.style.height = `${297 * pxPerMm * k}px`;
}

/** Что по этому заказу делать — то же правило, что строит список на дашборде. */
function todo(o) {
  const [task] = tasks([o]);
  if (!task) return "";
  return `<div class="todo"><div class="item ${task.level}">
    <div class="what">${escapeHtml(task.title)}</div>
    <div class="sum">${task.amount ? money(task.amount) : ""}</div>
    <div class="who">${escapeHtml(task.detail)}</div>
  </div></div>`;
}

/**
 * Приёмка: от неё зависит, спор перед нами или нет. Пока не отмечена —
 * так и сказано, без домыслов.
 */
function acceptance(o) {
  const c = o.computed;
  if (c.accepted_qty === null && c.rejected_qty === null) {
    return `<div class="src">Приёмка не отмечена. Пока неизвестно, сколько заказчик принял,
      недоплату не с чем сравнить — отметьте её в карточке.</div>`;
  }
  const price = o.get("unit_price");
  const shipped = o.get("shipped_qty");
  // Кольца и шкала отвечают на разные вопросы: кольца — сколько приняли и
  // сколько заплатили, шкала — в какую сторону и насколько разошлось.
  return `<div class="acc">
    <div class="acc-rings">
      ${ring({ value: shipped ? (c.accepted_qty ?? 0) / shipped : 0, size: 76, stroke: 8,
               tone: "var(--ok)", tone2: "var(--lime-deep)", title: "доля принятого от отгруженного" })}
      <span class="src">принято<br>от отгрузки</span>
      ${ring({ value: c.shipment_sum ? c.paid / c.shipment_sum : 0, size: 76, stroke: 8,
               tone: "var(--accent)", tone2: "#7cc0ff", title: "доля оплаченного от отгруженного" })}
      <span class="src">оплачено<br>от отгрузки</span>
    </div>
    ${balanceScale({
      value: c.unexplained ?? 0,
      span: Math.max(Math.abs(c.unexplained ?? 0), c.rejected_sum ?? 0, 1),
      left: "переплата ",
      right: "недоплата ",
      zero: c.settled ? "сходится в ноль — сделка закрыта" : "ноль",
      format: (v) => money(v),
    })}
  </div>
  <table>
    <tr><th>Принято</th><td>${qty(c.accepted_qty)} шт${c.accepted_sum !== null
          ? ` <span class="src">на ${money(c.accepted_sum)}</span>` : ""}</td>
        <th>Дата приёмки</th><td>${dateRu(o.get("acceptance_date"))}</td></tr>
    <tr><th>Не принято</th><td>${qty(c.rejected_qty)} шт${c.rejected_sum !== null
          ? ` <span class="src">на ${money(c.rejected_sum)} (${qty(c.rejected_qty)} × ${money(price)})</span>` : ""}</td>
        <th>Причина</th><td>${escapeHtml(o.get("reject_reason") || "не указана")}</td></tr>
    <tr><th>Вывод</th><td colspan="3">${c.settled
      ? `<b style="color:var(--ok)">Сделка закрыта.</b> Недоплата ${money(c.remainder)} это ровно
         непринятое — за всё принятое заплачено.`
      : c.unexplained > 0
        ? `<b style="color:var(--bad)">Недоплачено сверх непринятого ${money(c.unexplained)}.</b>
           Непринятое объясняет только ${money(c.rejected_sum)} из ${money(c.remainder)}.`
        : `<b style="color:var(--warn)">Заплачено на ${money(-c.unexplained)} больше, чем за принятое.</b>
           Либо приёмка отмечена неверно, либо часть непринятого всё-таки оплатили.`}</td></tr>
  </table>`;
}

function tile(name, value, hint, cls = "") {
  return `<div class="tile ${cls}"><span>${escapeHtml(name)}</span><b>${escapeHtml(value)}</b>
   <div class="hint">${escapeHtml(hint)}</div></div>`;
}

function calcRow(name, value, formula, total = false, unit = "") {
  return `<tr class="${total ? "total" : ""}"><td>${escapeHtml(name)}
     <div class="formula">${escapeHtml(formula)}</div></td>
   <td class="num">${unit ? `${qty(value)} ${unit}` : money(value)}</td></tr>`;
}

function plural(n) {
  const t = n % 10, h = n % 100;
  if (t === 1 && h !== 11) return "платёж";
  if (t >= 2 && t <= 4 && (h < 12 || h > 14)) return "платежа";
  return "платежей";
}
</script>
</body>
</html>
