<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточка заказа</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./styles.css">
<style>
  .links a { display: inline-block; margin: 0 10px 8px 0; }
  .acc { display: grid; gap: 16px; margin-bottom: 14px; }
  .acc-rings { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .acc-rings .src { margin-right: 18px; line-height: 1.3; }
  .hero { width: 36px; aspect-ratio: 3 / 4; height: auto; border-radius: 8px; object-fit: contain;
    background: var(--shot); padding: 2px; }
  /* Документы справа от фото: под рукой, не надо листать вниз. */
  .top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: start; margin: 0 0 18px; }
  .top.solo { grid-template-columns: minmax(0, 1fr); }
  .top .gallery { margin: 0; }
  .top-docs h3 { margin: 0; font-size: 15px; }
  @media (max-width: 900px) { .top { grid-template-columns: minmax(0, 1fr); } }
  /* Закупка ткани: таблица расцветок с расходом и метражом. */
  .fab-wrap { overflow: auto; min-height: 0; }
  .fab-head { margin: 4px 0 12px; }
  .fab-head b { font-size: 17px; }
  table.fab { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.fab th, table.fab td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: middle; }
  table.fab th { background: color-mix(in srgb, var(--ink) 7%, transparent); font-size: 12px; }
  table.fab td.ph { width: 52px; padding: 3px; }
  table.fab td.ph img { width: 46px; height: 60px; object-fit: contain; display: block; }
  table.fab input { width: 72px; padding: 4px 6px; }
  table.fab .m { font-weight: 600; white-space: nowrap; }
  table.fab td.x, table.fab th.x { width: 34px; padding: 2px; text-align: center; }
  table.fab td.x .icon { width: 26px; height: 26px; font-size: 12px; }
  table.fab tfoot td { background: color-mix(in srgb, var(--ink) 7%, transparent); font-weight: 600; }
  @media (max-width: 640px) {
    table.fab .mat, table.fab .sz { display: none; }
    table.fab { font-size: 12.5px; }
    table.fab th, table.fab td { padding: 4px 5px; }
    table.fab td.ph { width: 36px; padding: 2px; }
    table.fab td.ph img { width: 32px; height: 42px; }
    table.fab input { width: 34px; padding: 3px; }
    table.fab .m { white-space: normal; }
  }
  .hero.own { object-fit: cover; padding: 0; }
</style>
</head>
<body>
<div class="wrap">
  <p class="sub"><a href="./orders.html">← ко всем заказам</a></p>
  <div id="body"></div>

  <div class="overlay hide" id="blank-box">
    <div class="sheet-view">
      <div class="row-line">
        <b>Бланк заказа</b>
        <span class="src" id="blank-state"></span>
        <a class="btn primary hide" id="blank-save" style="margin-left:auto">Скачать PDF</a>
        <button id="blank-close">Закрыть</button>
      </div>
      <div class="bl-frame" id="blank-frame"><div class="bl-scale" id="blank-sheet"></div></div>
    </div>
  </div>

  <div class="overlay hide" id="fabric-box">
    <div class="sheet-view">
      <div class="row-line">
        <b>Закупка ткани</b>
        <span class="src" id="fabric-state"></span>
        <a class="btn primary" id="fabric-save" style="margin-left:auto">Скачать PDF</a>
        <button id="fabric-close">Закрыть</button>
      </div>
      <div class="fab-wrap" id="fabric-sheet"></div>
    </div>
  </div>
</div>

<script type="module">
import { money } from "./lib/ledger.js";
import { colorList } from "./lib/colors.js";
import { docsOf } from "./lib/documents.js";
import { hasFabric } from "./lib/fabric.js";
import { bindDocs, docsHtml } from "./lib/docview.js";
import { ownPhotos, photoImg } from "./lib/photo.js";
import { shipmentsOf, shipmentsWith } from "./lib/shipments.js";
import { tasks } from "./lib/stages.js";
import { balanceScale, ring } from "./lib/ui.js";
import { dateRu, escapeHtml, fatal, loadOrders, mountShell, qty, status, workshopChips } from "./lib/shell.js";

mountShell("orders.html");

const id = new URLSearchParams(location.search).get("id");

try {
  const { data, orders } = await loadOrders();
  const order = orders.find((o) => o.key === id);
  // Машина, в которой заказ уехал: документы на доставку и оплата карго общие
  // на всю отгрузку, и ходить за ними через список — лишний шаг.
  const [ride] = shipmentsWith(shipmentsOf(data, orders), id);
  if (!order) {
    fatal(`Заказ «${id || "без номера"}» не найден.`);
  } else {
    document.title = `${order.get("order_no") || order.key} — карточка заказа`;
    render(order, ride);
    document.querySelector("#blank").onclick = () => showBlank(order);
    const fb = document.querySelector("#fabric");
    if (fb) fb.onclick = () => showFabric(order);
    document.querySelector("#fabric-close").onclick = () =>
      document.querySelector("#fabric-box").classList.add("hide");
    document.querySelector("#blank-close").onclick = () =>
      document.querySelector("#blank-box").classList.add("hide");
  }
} catch (err) {
  fatal(`Не удалось загрузить данные: ${err.message}`);
}

function render(o, ride) {
  const c = o.computed;
  // Документы — как в разделе «Документы»: по видам, с просмотром здесь же.
  const all = docsOf(o);
  const docs = all.filter((d) => !d.folder), folder = all.find((d) => d.folder);
  const st = status(o);
  const price = o.get("unit_price");
  const edit = `${hasFabric(o) ? '<button id="fabric">Закупка ткани</button>' : ""}
    <button id="blank">Скачать бланк</button>
    <a class="btn" href="./admin.html?id=${encodeURIComponent(o.key)}">Править</a>`;

  document.querySelector("#body").innerHTML = `
    <div class="row-line" style="margin-bottom:6px">
      ${photoImg(o, { className: "hero" })}
      <h1 style="margin:0">${escapeHtml(o.contract_no || o.key)}</h1>
      <span class="pill">заказ ${escapeHtml(o.get("order_no") || "—")}</span>
      <span class="pill ${st.cls}">${st.name}</span>
      <span class="row-line" style="margin-left:auto">${edit}</span>
    </div>
    <p class="sub">${escapeHtml(o.get("item") || "изделие не указано")}${
      o.get("item_article") ? ` · арт. ${escapeHtml(o.get("item_article"))}` : ""}${
      o.get("tnved") ? ` · ТН ВЭД ${escapeHtml(o.get("tnved"))}` : ""}${
      o.get("order_date") ? ` · заказ от ${dateRu(o.get("order_date"))}` : ""}</p>
    ${o.workshops.length ? `<div class="chips" style="margin:-10px 0 18px">${workshopChips(o)}</div>` : ""}
    <div class="top${ownPhotos(o).length ? "" : " solo"}">
      ${gallery(o)}
      ${docs.length || folder ? `<section class="dcard top-docs">
        <h3>Документы</h3>
        ${docsHtml(docs, folder)}
      </section>` : ""}
    </div>

    ${todo(o)}

    <h2>Заказ</h2>
    <div class="card"><table>
      <tr><th>Заказано</th><td>${qty(o.get("ordered_qty"))} шт</td>
          <th>Цена пошива</th><td>${money(price)}</td></tr>
      <tr><th>ТН ВЭД</th><td>${escapeHtml(o.get("tnved") || "—")}</td>
          <th>Артикул</th><td>${escapeHtml(o.get("item_article") || "—")}</td></tr>
      <tr><th>Цех</th><td colspan="3">${o.workshops.length
            ? `<span class="chips">${workshopChips(o)}</span>` : "—"}</td></tr>
      <tr><th>Цвета</th><td colspan="3">${colorList(o.colors) || "—"}</td></tr>
      <tr><th>Сумма заказа</th><td colspan="3"><b>${money(c.order_sum)}</b>
          <span class="src">${qty(o.get("ordered_qty"))} шт × ${money(price)}</span></td></tr>
    </table></div>

    <h2>Отправка</h2>
    <div class="card"><table>
      ${ride ? `<tr><th>Отгрузка</th><td colspan="3">
        <a href="./shipment.html?id=${encodeURIComponent(ride.id)}">вся машина от ${
          dateRu(ride.date)} ↗</a>
        <span class="src">${ride.totals.orders > 1
          ? `в этот день уехали ещё ${ride.contracts.filter((n) => n !== (o.contract_no || o.key))
              .map(escapeHtml).join(", ")}`
          : "в этот день уехал только этот заказ"}</span></td></tr>` : ""}
      <tr><th>Дата</th><td>${dateRu(o.get("shipment_date"))}</td>
          <th>Мест</th><td>${qty(o.get("places"))}</td></tr>
      <tr><th>Количество</th><td>${qty(o.get("shipped_qty"))} шт</td>
          <th>Вес брутто</th><td>${qty(o.get("weight_gross"))} кг</td></tr>
      <tr><th>Сумма отгрузки</th><td colspan="3"><b>${money(c.shipment_sum)}</b>
          <span class="src">${qty(o.get("shipped_qty"))} шт × ${money(price)}</span></td></tr>
      <tr><th>Водитель</th><td>${escapeHtml(o.get("driver") || "—")}</td>
          <th>Телефон</th><td>${o.get("driver_phone")
            ? `<a href="tel:${escapeHtml(String(o.get("driver_phone")).replace(/[^+\d]/g, ""))}">${
                escapeHtml(o.get("driver_phone"))}</a>` : "—"}</td></tr>
    </table></div>

    <h2>Приёмка</h2>
    <div class="card">${acceptance(o)}</div>

    <h2>Платежи</h2>
    <div class="tiles" style="margin-bottom:12px">
      ${tile("Сумма заказа", money(c.order_sum), `${qty(o.get("ordered_qty"))} × ${money(price)}`)}
      ${tile("Сумма отгрузки", money(c.shipment_sum), `${qty(o.get("shipped_qty"))} × ${money(price)}`)}
      ${tile("Оплачено", money(c.paid), `${o.payments.length} ${plural(o.payments.length)}`)}
      ${tile("Остаток", money(c.remainder),
             c.remainder_units != null ? `≈ ${qty(c.remainder_units)} шт` : "нет данных об отгрузке",
             (c.remainder || 0) > 0.5 ? "bad" : (c.remainder === 0 ? "ok" : ""))}
    </div>

    <div class="card">${o.payments.length ? `<table>
      <tr><th>Вид</th><th>Дата</th><th class="num">Сумма</th><th>Документ</th></tr>
      ${o.payments.map((p) => `<tr>
        <td>${escapeHtml(p.kind)}${p.inferred_from
            ? `<div class="src">${escapeHtml(p.inferred_from)}</div>` : ""}</td>
        <td>${dateRu(p.date)}</td>
        <td class="num">${money(p.amount)}</td>
        <td>${escapeHtml(p.doc_number || "—")}${p.purpose
            ? `<div class="src">${escapeHtml(p.purpose)}</div>` : ""}</td></tr>`).join("")}
      </table>` : '<span class="src">Платежей нет.</span>'}</div>

    ${o.flags.length ? `<h2>Проверки</h2><div class="card">
      ${o.flags.map((f) => `<div class="flag ${f.level}">${escapeHtml(f.message)}</div>`).join("")}
      </div>` : ""}

    ${o.note ? `<h2>Заметка</h2><div class="card">${escapeHtml(o.note)}</div>` : ""}

    <p class="src" style="margin-top:20px">Условия: предоплата ${
      o.terms.prepay_percent ?? 50}%, ${o.terms.lead_time_days
        ? `срок исполнения ${o.terms.lead_time_days} дн.`
        : "срок исполнения не задан"}.${
      c.due_date ? ` Срок сдачи ${dateRu(c.due_date)}.` : ""}</p>
  `;
  bindDocs(document.querySelector("#body"), [{ docs, folder }]);
}

// Объявлениями функций, а не const: render() вызывается выше по файлу, и
// стрелочные константы к тому моменту ещё не инициализированы.
/**
 * Бланк: четыре копии на листе. Показываем сам PDF, а не его подобие в
 * HTML, — что на экране, то и напечатается. Шрифты и сборщик грузятся
 * только по нажатию: это 80 КБ, которые незачем тянуть всем.
 */
let blankRows = null;

async function showBlank(o) {
  const box = document.querySelector("#blank-box");
  const frame = document.querySelector("#blank-frame");
  const save = document.querySelector("#blank-save");
  const state = document.querySelector("#blank-state");

  box.classList.remove("hide");
  state.textContent = "Готовлю бланк…";
  try {
    const [{ loadFonts }, { bindCopies, blankHtml, blankName, blankPdf, fitPreview, rowValues, PAGE }] =
      await Promise.all([import("./lib/pdf.js"), import("./lib/blank.js")]);

    const sheet = document.querySelector("#blank-sheet");
    // Живут, пока открыта страница: закрыл лист и открыл снова — вписанное на месте.
    blankRows ??= rowValues(o);
    sheet.innerHTML = blankHtml(o, blankRows);
    fitPreview(sheet);
    fit(frame, sheet, PAGE.width);
    window.addEventListener("resize", () => fit(frame, sheet, PAGE.width));

    const fonts = await loadFonts();
    const rebuild = () => {
      const bytes = blankPdf(o, fonts, blankRows);
      const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
      if (save.dataset.url) URL.revokeObjectURL(save.dataset.url);
      save.dataset.url = url;
      save.href = url;
    };
    rebuild();
    bindCopies(sheet, blankRows, rebuild);
    save.download = blankName(o);
    save.classList.remove("hide");
    state.textContent = "Впишите прямо на листе: одна копия заполняет остальные три. В карточку не сохраняется.";
  } catch (err) {
    state.textContent = `Не получилось собрать бланк: ${err.message}`;
  }
}

/**
 * Закупка ткани: расход вписывают в любую строку — он встаёт во все, метраж
 * по цветам и итог пересчитываются сразу, PDF собирается с тем же расходом.
 * Фото грузятся только здесь, при открытии окна: на скорость карточки и
 * списка заказов они не влияют.
 */
let fabricRate = null;
const fabricSkip = new Map();   // ключ заказа → убранные цвета
const cap = (v) => String(v || "").charAt(0).toUpperCase() + String(v || "").slice(1);
async function showFabric(o) {
  const box = document.querySelector("#fabric-box");
  const state = document.querySelector("#fabric-state");
  const save = document.querySelector("#fabric-save");
  const sheet = document.querySelector("#fabric-sheet");
  box.classList.remove("hide");
  const { fabricRows, fabricPdf, fabricName, fmtMeters, meters, parseRate, perSize, totals } = await import("./lib/fabric.js");
  const rows = fabricRows(o);
  const date = o.get("order_date");
  sheet.innerHTML = `<div class="fab-head"><b>Договор № ${escapeHtml(o.contract_no || o.key)}${
      date ? ` от ${dateRu(date)}` : ""}</b><div class="src">${escapeHtml(o.get("item") || "")}</div></div>
    <table class="fab"><thead><tr><th>Фото</th><th>Цвет</th><th class="mat">Материал</th><th class="sz">Размеры</th>
      <th>Кол-во</th><th>Расход,<br>м</th><th>Метраж<br>к закупке</th><th class="x"></th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr>
      <td class="ph">${r.photo ? `<img src="./${escapeHtml(r.photo)}" alt="" loading="lazy">` : ""}</td>
      <td><b>${escapeHtml(cap(r.name))}</b></td>
      <td class="mat">${escapeHtml(r.material || "—")}</td>
      <td class="sz">${escapeHtml(r.sizes || "—")}</td>
      <td>${qty(r.qty)} шт${perSize(r.qty, r.sizes) ? `<div class="src">по ${perSize(r.qty, r.sizes)} на размер</div>` : ""}</td>
      <td><input inputmode="decimal" data-rate="${i}" aria-label="Расход на 1 шт, м"></td>
      <td class="m" data-m="${i}">0 м</td>
      <td class="x"><button type="button" class="icon" data-skip="${i}" title="Убрать цвет из закупки"
        aria-label="Убрать ${escapeHtml(r.name)} из закупки">✕</button></td></tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="2">Итого</td><td class="mat"></td><td class="sz"></td><td id="fab-qty"></td><td></td><td class="m" id="fab-total">0 м</td><td class="x"></td></tr></tfoot>
    </table>
    <p class="src" id="fab-skipped" style="margin:10px 0 0"></p>`;
  const inputs = [...sheet.querySelectorAll("[data-rate]")];
  // Убранные цвета: ткань на них уже куплена или их не шьют. Только для
  // этой закупки и этого PDF — в карточке цвет остаётся.
  const skip = fabricSkip.get(o.key) || new Set();
  fabricSkip.set(o.key, skip);
  const draw = () => {
    const left = rows.filter((r) => !skip.has(r.name));
    rows.forEach((r, i) => sheet.querySelectorAll("tbody tr")[i].classList.toggle("hide", skip.has(r.name)));
    for (const el of sheet.querySelectorAll("[data-m]")) {
      el.textContent = `${fmtMeters(meters(rows[+el.dataset.m].qty, fabricRate))} м`;
    }
    sheet.querySelector("#fab-qty").textContent = `${qty(totals(left, null).qty)} шт`;
    sheet.querySelector("#fab-total").textContent = `${fmtMeters(totals(left, fabricRate).meters)} м`;
    const gone = rows.filter((r) => skip.has(r.name));
    const note = sheet.querySelector("#fab-skipped");
    note.innerHTML = gone.length ? `Убраны из закупки: ${gone.map((r) => escapeHtml(cap(r.name))).join(", ")}.
      <a href="#" id="fab-restore">Вернуть все</a>` : "";
    const back = sheet.querySelector("#fab-restore");
    if (back) back.onclick = (e) => { e.preventDefault(); skip.clear(); delete save.dataset.ready; draw(); };
  };
  for (const b of sheet.querySelectorAll("[data-skip]")) {
    b.onclick = () => { skip.add(rows[+b.dataset.skip].name); delete save.dataset.ready; draw(); };
  }
  const shown = fabricRate === null ? "" : fmtMeters(fabricRate);
  for (const el of inputs) {
    el.value = shown;
    el.addEventListener("input", () => {
      fabricRate = parseRate(el.value);
      for (const other of inputs) if (other !== el) other.value = el.value;
      draw();
    });
  }
  draw();

  save.download = fabricName(o);
  save.onclick = async (e) => {
    if (save.dataset.ready === String(fabricRate)) return;   // уже собран с этим расходом и цветами
    e.preventDefault();
    state.textContent = "Собираю PDF…";
    try {
      const { loadFonts } = await import("./lib/pdf.js");
      const fonts = await loadFonts();
      const photos = new Map();
      await Promise.all(rows.filter((r) => r.photo).map(async (r) => {
        try { photos.set(r.photo, new Uint8Array(await (await fetch(`./${r.photo}`)).arrayBuffer())); } catch {}
      }));
      const url = URL.createObjectURL(new Blob([fabricPdf(o, fonts, fabricRate, photos, skip)], { type: "application/pdf" }));
      if (save.dataset.url) URL.revokeObjectURL(save.dataset.url);
      save.dataset.url = url;
      save.href = url;
      save.dataset.ready = String(fabricRate);
      state.textContent = "";
      save.click();
    } catch (err) {
      state.textContent = `Не получилось собрать PDF: ${err.message}`;
    }
  };
  for (const el of inputs) el.addEventListener("input", () => { delete save.dataset.ready; });
  state.textContent = "Впишите расход на 1 шт — он встанет во все цвета. ✕ убирает цвет из закупки. В карточку не сохраняется.";
}

/** Ужать лист под ширину окна, сохранив печатные пропорции. */
function fit(frame, sheet, widthMm) {
  const pxPerMm = 96 / 25.4;
  const room = frame.clientWidth - 24;
  const k = Math.min(1, room / (widthMm * pxPerMm));
  sheet.style.setProperty("--k", k.toFixed(3));
  sheet.style.height = `${297 * pxPerMm * k}px`;
}

/** Что по этому заказу делать — то же правило, что строит список на дашборде. */
function todo(o) {
  const [task] = tasks([o]);
  if (!task) return "";
  return `<div class="todo"><div class="item ${task.level}">
    <div class="what">${escapeHtml(task.title)}</div>
    <div class="sum">${task.amount ? money(task.amount) : ""}</div>
    <div class="who">${escapeHtml(task.detail)}</div>
  </div></div>`;
}

/**
 * Приёмка: от неё зависит, спор перед нами или нет. Пока не отмечена —
 * так и сказано, без домыслов.
 */
function acceptance(o) {
  const c = o.computed;
  if (c.accepted_qty === null && c.rejected_qty === null) {
    return `<div class="src">Приёмка не отмечена. Пока неизвестно, сколько заказчик принял,
      недоплату не с чем сравнить — отметьте её в карточке.</div>`;
  }
  const price = o.get("unit_price");
  const shipped = o.get("shipped_qty");
  // Кольца и шкала отвечают на разные вопросы: кольца — сколько приняли и
  // сколько заплатили, шкала — в какую сторону и насколько разошлось.
  return `<div class="acc">
    <div class="acc-rings">
      ${ring({ value: shipped ? (c.accepted_qty ?? 0) / shipped : 0, size: 76, stroke: 8,
               tone: "var(--ok)", tone2: "var(--lime-deep)", title: "доля принятого от отгруженного" })}
      <span class="src">принято<br>от отгрузки</span>
      ${ring({ value: c.shipment_sum ? c.paid / c.shipment_sum : 0, size: 76, stroke: 8,
               tone: "var(--accent)", tone2: "#7cc0ff", title: "доля оплаченного от отгруженного" })}
      <span class="src">оплачено<br>от отгрузки</span>
    </div>
    ${balanceScale({
      value: c.unexplained ?? 0,
      span: Math.max(Math.abs(c.unexplained ?? 0), c.rejected_sum ?? 0, 1),
      left: "переплата ",
      right: "недоплата ",
      zero: c.settled ? "сходится в ноль — сделка закрыта" : "ноль",
      format: (v) => money(v),
    })}
  </div>
  <table>
    <tr><th>Принято</th><td>${qty(c.accepted_qty)} шт${c.accepted_sum !== null
          ? ` <span class="src">на ${money(c.accepted_sum)}</span>` : ""}</td>
        <th>Дата приёмки</th><td>${dateRu(o.get("acceptance_date"))}</td></tr>
    <tr><th>Не принято</th><td>${qty(c.rejected_qty)} шт${c.rejected_sum !== null
          ? ` <span class="src">на ${money(c.rejected_sum)} (${qty(c.rejected_qty)} × ${money(price)})</span>` : ""}</td>
        <th>Причина</th><td>${escapeHtml(o.get("reject_reason") || "не указана")}</td></tr>
    <tr><th>Вывод</th><td colspan="3">${c.settled
      ? `<b style="color:var(--ok)">Сделка закрыта.</b> Недоплата ${money(c.remainder)} это ровно
         непринятое — за всё принятое заплачено.`
      : c.unexplained > 0
        ? `<b style="color:var(--bad)">Недоплачено сверх непринятого ${money(c.unexplained)}.</b>
           Непринятое объясняет только ${money(c.rejected_sum)} из ${money(c.remainder)}.`
        : `<b style="color:var(--warn)">Заплачено на ${money(-c.unexplained)} больше, чем за принятое.</b>
           Либо приёмка отмечена неверно, либо часть непринятого всё-таки оплатили.`}</td></tr>
  </table>`;
}

/**
 * Снимки изделия крупно, по нажатию — на весь экран. Рисунки по названию
 * здесь не показываются: они только заглушка для списка.
 */
function gallery(o) {
  const photos = ownPhotos(o);
  if (!photos.length) return "";
  return `<div class="gallery">${photos.map((url, i) =>
    `<button type="button" onclick="openPhoto('${escapeHtml(url)}')" title="Открыть крупно">
      <img src="${escapeHtml(url)}" alt="Фото изделия ${i + 1}" loading="lazy"></button>`).join("")}</div>`;
}

window.openPhoto = (url) => {
  const box = document.createElement("div");
  box.className = "viewer";
  box.innerHTML = `<img src="${escapeHtml(url)}" alt="">`;
  const close = () => { box.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  box.onclick = close;
  document.addEventListener("keydown", onKey);
  document.body.append(box);
};

function tile(name, value, hint, cls = "") {
  return `<div class="tile ${cls}"><span>${escapeHtml(name)}</span><b>${escapeHtml(value)}</b>
   <div class="hint">${escapeHtml(hint)}</div></div>`;
}


function plural(n) {
  const t = n % 10, h = n % 100;
  if (t === 1 && h !== 11) return "платёж";
  if (t >= 2 && t <= 4 && (h < 12 || h > 14)) return "платежа";
  return "платежей";
}
