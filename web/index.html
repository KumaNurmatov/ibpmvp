<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд заказов</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📊</text></svg>">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap">
  <h1>Дашборд</h1>
  <p class="sub" id="updated">Загружаю…</p>

  <div class="tiles" id="tiles"></div>

  <h2>Требует внимания</h2>
  <div id="attention"></div>

  <h2>По месяцам</h2>
  <div class="charts">
    <div id="chart-flow"></div>
    <div id="chart-debt"></div>
  </div>

  <h2>Самые крупные долги</h2>
  <div class="card"><table class="wide" id="top"></table></div>
</div>

<script type="module">
import { byMonth, groupedBars, lineChart } from "./lib/charts.js";
import { money } from "./lib/ledger.js";
import { dateRu, escapeHtml, fatal, loadOrders, mountHeader, qty, showUpdated, status } from "./lib/shell.js";

mountHeader("index.html");

try {
  const { data, orders } = await loadOrders();
  showUpdated(document.querySelector("#updated"), data?.updated);
  if (!orders.length) {
    fatal("Заказов пока нет. Добавьте первый на странице «Редактирование».");
  }
  render(orders);
} catch (err) {
  fatal(`Не удалось загрузить данные: ${err.message}`);
}

function render(orders) {
  const debt = orders.reduce((s, o) => s + (o.computed.remainder || 0), 0);
  const units = orders.reduce((s, o) => s + (o.computed.remainder_units || 0), 0);
  const noPostpay = orders.filter((o) => status(o).name === "Нет постоплаты");
  const closed = orders.filter((o) => status(o).name === "Закрыт");
  const late = orders.filter((o) => (o.computed.overdue_days || 0) > 0);
  const penalty = late.reduce((s, o) => s + (o.computed.penalty || 0), 0);

  tiles([
    ["Остаток к перечислению", money(debt), `${qty(Math.round(units))} шт по текущим ценам`, debt > 0 ? "bad" : ""],
    ["Заказов в работе", qty(orders.length - closed.length), `закрыто ${closed.length} из ${orders.length}`, ""],
    ["Без постоплаты", qty(noPostpay.length),
      noPostpay.length ? money(noPostpay.reduce((s, o) => s + (o.computed.remainder || 0), 0)) : "таких нет",
      noPostpay.length ? "bad" : ""],
    ["Просрочено отгрузок", qty(late.length),
      penalty ? `неустойка по условиям ${money(penalty)}` : "в срок", late.length ? "warn" : ""],
  ]);

  attention(orders);

  const months = byMonth(orders);
  if (months.length) {
    groupedBars(document.querySelector("#chart-flow"), {
      rows: months,
      series: [{ key: "shipped", name: "Отгружено", color: "--series-1" },
               { key: "paid", name: "Оплачено", color: "--series-2" }],
      caption: "Отгружено и оплачено по месяцам",
      lede: "Разрыв между столбцами одного месяца — то, что в этом месяце не доплатили.",
    });
    lineChart(document.querySelector("#chart-debt"), {
      rows: months, key: "debt",
      caption: "Долг нарастающим итогом",
      lede: "Сумма всех отгрузок минус все поступления на конец месяца.",
    });
  } else {
    document.querySelector("#chart-flow").innerHTML =
      '<div class="card src">Пока нет ни отгрузок, ни платежей с датами.</div>';
  }

  topDebtors(orders);
}

function tiles(items) {
  document.querySelector("#tiles").innerHTML = items.map(([name, value, hint, cls]) =>
    `<div class="tile ${cls}"><span>${escapeHtml(name)}</span><b>${escapeHtml(value)}</b>
     <div class="hint">${escapeHtml(hint)}</div></div>`).join("");
}

function attention(orders) {
  const rows = orders
    .map((o) => ({ order: o, flags: o.flags.filter((f) => f.level !== "info") }))
    .filter((r) => r.flags.length)
    .sort((a, b) => b.flags.length - a.flags.length);

  document.querySelector("#attention").innerHTML = rows.length
    ? rows.map(({ order, flags }) => `<div class="card">
        <div class="row-line">
          <a href="./order.html?id=${encodeURIComponent(order.key)}"><b>${escapeHtml(order.get("order_no") || order.key)}</b></a>
          <span class="pill">договор ${escapeHtml(order.contract_no || "—")}</span>
          <span class="pill ${status(order).cls}">${status(order).name}</span>
          <span class="src">${escapeHtml(order.get("item") || "")}</span>
        </div>
        ${flags.map((f) => `<div class="flag ${f.level}">${escapeHtml(f.message)}</div>`).join("")}
      </div>`).join("")
    : '<div class="card src">Замечаний нет — все заказы сходятся.</div>';
}

function topDebtors(orders) {
  const rows = orders
    .filter((o) => (o.computed.remainder || 0) > 0.5)
    .sort((a, b) => b.computed.remainder - a.computed.remainder)
    .slice(0, 10);

  document.querySelector("#top").innerHTML = rows.length
    ? `<tr><th>Заказ</th><th>Изделие</th><th>Отгрузка</th>
         <th class="num">Остаток</th><th class="num">В штуках</th></tr>` +
      rows.map((o) => `<tr class="row">
        <td><a href="./order.html?id=${encodeURIComponent(o.key)}">${escapeHtml(o.get("order_no") || o.key)}</a>
            <div class="src">${escapeHtml(o.contract_no || "")}</div></td>
        <td>${escapeHtml(o.get("item") || "—")}</td>
        <td>${dateRu(o.get("shipment_date"))}</td>
        <td class="num"><b>${money(o.computed.remainder)}</b></td>
        <td class="num">${qty(o.computed.remainder_units)}</td></tr>`).join("")
    : '<tr><td class="src">Долгов нет.</td></tr>';
}
</script>
</body>
</html>
